<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>扫码使用面料报价工具</title>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;background:#f7f8fb;font-family:"Microsoft YaHei",Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
    .card{background:#fff;border-radius:16px;padding:36px 28px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.1);max-width:420px;width:100%;}
    h1{font-size:22px;margin:0 0 6px;color:#202124;}
    .sub{color:#636b74;font-size:14px;margin:0 0 24px;}
    .qr-wrap{display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
    .qr-wrap img{width:260px;height:260px;display:block;}
    .url{margin:0 0 16px;padding:10px 14px;background:#eef5f3;border-radius:8px;font-size:14px;color:#2d756d;word-break:break-all;font-family:monospace;}
    .hint{color:#636b74;font-size:13px;margin:0;line-height:1.6;}
    .hint strong{color:#2d756d;}
  </style>
</head>
<body>
  <div class="card">
    <h1>面料与成衣报价工具</h1>
    <p class="sub">手机扫码即可使用，数据自动保存</p>
    <div class="qr-wrap">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://cfe96fdfbfea4afdb2f1b7f89d667d86.app.codebuddy.work" alt="扫码打开工具" loading="eager">
    </div>
    <p class="url">https://cfe96fdfbfea4afdb2f1b7f89d667d86.app.codebuddy.work</p>
    <p class="hint">
      <strong>手机扫描二维码</strong>即可打开工具<br>
      支持添加到主屏幕，像 App 一样使用<br>
      数据保存在手机浏览器中，导出备份更安全
    </p>
  </div>
</body>
</html>
