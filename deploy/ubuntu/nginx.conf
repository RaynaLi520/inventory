limit_req_zone $binary_remote_addr zone=inventory_api:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name inventory.justinallen.com 172.16.100.198;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name inventory.justinallen.com 172.16.100.198;

    root /opt/henan-inventory;
    index index.html;
    client_max_body_size 18m;
    server_tokens off;

    ssl_certificate /etc/ssl/henan-inventory/server.crt;
    ssl_certificate_key /etc/ssl/henan-inventory/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:InventoryTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        limit_req zone=inventory_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /login.html { return 302 /; }
    location = /assets/auth.css { expires -1; }
    location = /assets/auth.js { expires -1; }
    location = /assets/lucide.min.js { expires 7d; }
    location = /assets/icon.svg { expires 7d; }
    location = /assets/icon-180.png { expires 7d; }

    location /media/ {
        alias /var/lib/henan-inventory/media/;
        expires -1;
    }

    location ~ ^/(?:server|deploy|node_modules|\.git)(?:/|$) { return 404; }
    location ~ ^/(?:package(?:-lock)?\.json|.*\.sql)$ { return 404; }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
