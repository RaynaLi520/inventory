<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="80" fill="#2d756d"/>
  <g transform="translate(256,260)">
    <!-- 面料卷轴 -->
    <rect x="-60" y="-80" width="120" height="150" rx="12" fill="#ffffff" opacity="0.18"/>
    <rect x="-50" y="-70" width="100" height="130" rx="8" fill="#ffffff" opacity="0.12"/>
    <line x1="-40" y1="-50" x2="40" y2="-50" stroke="#ffffff" stroke-width="3" opacity="0.3"/>
    <line x1="-40" y1="-30" x2="40" y2="-30" stroke="#ffffff" stroke-width="3" opacity="0.25"/>
    <line x1="-40" y1="-10" x2="40" y2="-10" stroke="#ffffff" stroke-width="3" opacity="0.3"/>
    <line x1="-40" y1="10" x2="40" y2="10" stroke="#ffffff" stroke-width="3" opacity="0.25"/>
    <line x1="-40" y1="30" x2="40" y2="30" stroke="#ffffff" stroke-width="3" opacity="0.3"/>
  </g>
  <!-- 美元符号表示报价 -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#ffffff" fill-opacity="0.9">¥</text>
</svg>
